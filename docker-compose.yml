version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-productivity-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - app-data:/app/data

networks:
  app-network:
    driver: bridge

volumes:
  app-data:
