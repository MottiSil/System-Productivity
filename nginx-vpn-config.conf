# Nginx configuration for System Productivity App with VPN access restriction
# Place this file in /etc/nginx/sites-available/system-productivity
# Then create a symlink: sudo ln -s /etc/nginx/sites-available/system-productivity /etc/nginx/sites-enabled/

server {
    listen 3000;
    server_name _;

    # Replace 10.8.0.0/24 with your VPN subnet
    # Add multiple "allow" lines if you have multiple VPN subnets
    allow 10.8.0.0/24;
    
    # Deny all other access
    deny all;

    # Logging
    access_log /var/log/nginx/system-productivity-access.log;
    error_log /var/log/nginx/system-productivity-error.log;

    # Proxy settings
    location / {
        # Proxy to the Node.js application running on port 3001
        # (We use 3001 internally so Nginx can listen on 3000)
        proxy_pass http://localhost:3001;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

